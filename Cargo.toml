[package]
name = "querymass"
version = "0.1.0"
edition = "2024"
description = "Aplicativo desktop para executar consultas MySQL em várias máquinas"

[dependencies]
eframe = "0.33"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls"] }
calamine = "0.36"
csv = "1.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_extras = { version = "0.33", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[features]
ui-qa = []
