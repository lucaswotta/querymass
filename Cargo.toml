[package]
name = "querymass"
version = "0.1.0"
edition = "2024"
description = "Aplicativo desktop para executar consultas MySQL em várias máquinas"

[dependencies]
eframe = "0.33"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls"] }
calamine = "0.36"
csv = "1.4"
rfd = "0.17"
